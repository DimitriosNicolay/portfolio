name: Website checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s tests -v
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: node --test tests/i18n.test.mjs
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
