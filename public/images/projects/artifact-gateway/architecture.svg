<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1240" viewBox="0 0 800 1240" role="img" aria-labelledby="title desc">
  <title id="title">Artifact Gateway: Ressourcen und Datenfluss</title>
  <desc id="desc">CDK definiert S3, Lambda, DynamoDB und einen CloudWatch-Alarm. Ein Manifest-Upload in S3 löst Lambda aus. Lambda liest die Dateien, schreibt Ergebnisse nach DynamoDB und löscht bei Ablehnung die Dateien. CloudWatch überwacht Lambda-Fehler ohne eingerichtete Alarm-Action.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#555" stroke-width="1.5"/></marker></defs>
  <rect width="800" height="1240" fill="#fafafa"/>
  <style>text{font-family:Arial,sans-serif;fill:#171717;text-anchor:middle}.title{font-size:38px}.label{font-size:31px;fill:#454545}.small{font-size:27px;fill:#555}.node{fill:white;stroke:#888;stroke-width:2}.line{fill:none;stroke:#555;stroke-width:3;marker-end:url(#arrow)}</style>
  <rect x="100" y="35" width="600" height="120" rx="8" fill="#eee" stroke="#777" stroke-dasharray="8 6"/>
  <text x="400" y="85" class="title">AWS CDK · TypeScript</text><text x="400" y="128" class="label">definiert Ressourcen und IAM</text>
  <text x="400" y="220" class="label">Upload: Payload vor Manifest</text>
  <path d="M400 240V282" class="line"/>
  <rect x="130" y="295" width="540" height="150" rx="8" class="node"/>
  <text x="400" y="350" class="title">S3-Bucket</text><text x="400" y="397" class="label">payload.txt + manifest.json</text>
  <path d="M400 445V465 M400 515V542" class="line"/><text x="400" y="500" class="small">ObjectCreated · Suffix manifest.json</text>
  <rect x="130" y="555" width="540" height="155" rx="8" class="node"/>
  <text x="400" y="610" class="title">Lambda · Node.js 24</text><text x="400" y="657" class="label">Manifest lesen · SHA-256 prüfen</text>
  <path d="M130 620H55V370H117" class="line"/><text x="28" y="510" class="small" transform="rotate(-90 28 510)">lesen / bei Ablehnung löschen</text>
  <path d="M400 710V730 M400 785V817" class="line"/><text x="400" y="770" class="label">Ergebnis schreiben</text>
  <rect x="130" y="830" width="540" height="150" rx="8" class="node"/>
  <text x="400" y="883" class="title">DynamoDB-Registry</text><text x="400" y="930" class="label">approved / rejected + Zeitpunkt</text>
  <path d="M670 635H750V1105H683" class="line" stroke-dasharray="8 7"/>
  <text x="712" y="855" class="small" transform="rotate(90 712 855)">Lambda-Fehlermetrik</text>
  <rect x="130" y="1030" width="540" height="150" rx="8" class="node"/>
  <text x="400" y="1084" class="title">CloudWatch-Alarm</text><text x="400" y="1131" class="label">Errors ≥ 1 · keine Alarm-Action</text>
  <text x="400" y="1220" class="small">Aus dem Projektcode abgeleitet · keine Laufzeitmessung</text>
</svg>
