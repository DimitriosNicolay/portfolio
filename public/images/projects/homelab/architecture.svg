<title id="title">The web-facing application path</title>
<desc id="desc">Caddy virtual hosts proxy to application endpoints. Immich, Paperless and Syncthing declare persistent data locations. Samba shares and Tailscale access are configured separately; this is not a live reachability test.</desc>
