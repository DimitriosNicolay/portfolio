<title id="title">Provision, configure, then review</title>
<desc id="desc">CDKTF definitions generate the Terraform configuration. The VM stack provisions the instance and outputs addresses. The post-deploy stack configures DNS and calls Ansible. The core-router configuration is generated for manual review and application.</desc>
