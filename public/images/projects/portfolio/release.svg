<title id="title">A website release</title>
<desc id="desc">GitHub Actions checks and builds the application, then publishes a commit-tagged image to GHCR. The SSH deployment updates the website container and checks HTTP health. Failure triggers an attempt to restore the previous image and environment.</desc>
